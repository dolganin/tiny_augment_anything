[project]
name = "tiny_augment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "albumentations>=2.0.8",
    "hydra-core>=1.3.2",
    "mlflow>=3.10.1",
    "opencv-python>=4.13.0.92",
    "timm>=1.0.25",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_augment"]

[project.scripts]
do-pretrain = "tiny_augment.cli:pretrain"
do-finetune = "tiny_augment.cli:fine_tune"