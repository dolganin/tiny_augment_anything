[project]
name = "tiny_augment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "albumentations>=2.0.8",
    "ipykernel>=7.2.0",
    "numpy",
    "opencv-python-headless",
    "hydra-core>=1.3.2",
    "mlflow>=3.10.1",
    "opencv-python>=4.13.0.92",
    "omegaconf>=2.3.0",
    "pandas",
    "pillow",
    "psycopg[binary]>=3.2.9",
    "redis>=6.4.0",
    "scikit-learn",
    "timm>=1.0.25",
    "torch",
    "torchvision",
    "tqdm",
    "uvicorn>=0.38.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_augment"]

[project.scripts]
do-pretrain = "tiny_augment.cli:pretrain"
do-finetune = "tiny_augment.cli:fine_tune"
