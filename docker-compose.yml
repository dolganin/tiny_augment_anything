services:
  frontend:
    image: node:20-alpine
    container_name: tiny_augment_frontend
    working_dir: /app
    ports:
      - "5444:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_WS_BASE_URL: /ws
      BACKEND_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tiny_augment_backend
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      APP_CONFIG_PATH: /app/config/app.yaml
      APP_RUNTIME_DIR: /big_data/augment_anything
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./src:/app/src
      - ./storage/tiny-augment:/big_data/augment_anything
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./README.md:/app/README.md
    command: ["uv", "run", "--no-sync", "uvicorn", "backend.app.asgi:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()",
        ]
      interval: 120s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tiny_augment_worker
    working_dir: /app
    command: ["uv", "run", "--no-sync", "python", "-m", "backend.worker"]
    environment:
      APP_CONFIG_PATH: /app/config/app.yaml
      APP_RUNTIME_DIR: /big_data/augment_anything
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./src:/app/src
      - ./storage/tiny-augment:/big_data/augment_anything
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./README.md:/app/README.md
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: tiny_augment_postgres
    environment:
      POSTGRES_DB: tinyaugment
      POSTGRES_USER: tinyaugment
      POSTGRES_PASSWORD: tinyaugment
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyaugment -d tinyaugment"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tiny_augment_redis
    volumes:
      - redis_data:/data

volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
